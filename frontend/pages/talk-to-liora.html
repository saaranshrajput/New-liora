<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talk to Liora | Liora</title>
    <style>
      :root {
        --bg: #021216;
        --panel: rgba(11, 15, 18, 0.86);
        --panel-strong: #0b0f12;
        --card: #0d171b;
        --line: rgba(0, 204, 255, 0.28);
        --line-strong: rgba(0, 255, 170, 0.5);
        --text: #e6f2f2;
        --muted: #9bb0b7;
        --cyan: #00ccff;
        --teal: #00ffaa;
        --gold: #ffde59;
        --shadow: rgba(0, 0, 0, 0.38);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background:
          radial-gradient(
            circle at top,
            rgba(0, 204, 255, 0.16),
            transparent 32%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(0, 255, 170, 0.14),
            transparent 28%
          ),
          var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        padding: 24px;
      }

      .chat-shell {
        width: min(1200px, 100%);
        min-height: calc(100vh - 48px);
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: rgba(2, 18, 22, 0.76);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }

      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
        background: rgba(9, 15, 18, 0.9);
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffde59 40%, #ff8800 100%);
        box-shadow:
          0 0 14px rgba(255, 222, 89, 0.9),
          0 0 22px rgba(255, 136, 0, 0.8);
      }

      .brand-text {
        font-size: clamp(1.2rem, 2vw, 1.8rem);
        font-weight: 800;
        letter-spacing: 0.18em;
        color: var(--teal);
      }

      .header-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #39d98a;
        box-shadow: 0 0 10px rgba(57, 217, 138, 0.9);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .ghost-link,
      .header-actions a {
        color: var(--cyan);
        text-decoration: none;
        font-weight: 600;
      }

      .primary-button {
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        background: linear-gradient(90deg, var(--teal), var(--cyan));
        color: #04131a;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }

      .chat-body {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        min-height: 0;
      }

      .sidebar {
        border-right: 1px solid var(--line);
        background: rgba(13, 23, 27, 0.88);
        padding: 18px 16px;
      }

      .sidebar-panel {
        background: rgba(7, 25, 29, 0.9);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }

      .sidebar-label {
        margin: 0 0 10px;
        color: var(--muted);
        text-transform: uppercase;
        font-size: 0.7rem;
        letter-spacing: 0.12em;
      }

      .suggestion-list {
        display: grid;
        gap: 10px;
      }

      .suggestion-chip {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(12, 19, 21, 0.8);
        color: var(--text);
        padding: 10px 12px;
        text-align: left;
        cursor: pointer;
        font-size: 0.92rem;
      }

      .suggestion-chip:hover {
        border-color: var(--line-strong);
      }

      .main-panel {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 0;
      }

      .canvas-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 20px 12px;
        border-bottom: 1px solid rgba(0, 204, 255, 0.14);
      }

      .canvas-header h1 {
        margin: 0;
        font-size: clamp(1.2rem, 2vw, 1.7rem);
        color: var(--teal);
      }

      .model-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(7, 25, 29, 0.8);
        color: var(--muted);
        font-size: 0.82rem;
      }

      .messages {
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow-y: auto;
        padding: 18px 20px;
        background: linear-gradient(
          180deg,
          rgba(2, 18, 22, 0.6),
          rgba(4, 12, 17, 0.9)
        );
      }

      .message {
        max-width: min(78%, 760px);
        padding: 14px 16px;
        border-radius: 18px;
        line-height: 1.55;
        font-size: 0.99rem;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .message.user {
        align-self: flex-end;
        background: linear-gradient(
          135deg,
          rgba(0, 255, 170, 0.2),
          rgba(0, 204, 255, 0.2)
        );
        border: 1px solid rgba(0, 255, 170, 0.35);
      }

      .message.bot {
        align-self: flex-start;
        background: rgba(13, 23, 27, 0.92);
        border: 1px solid rgba(0, 204, 255, 0.22);
      }

      .composer {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 16px 20px 20px;
        border-top: 1px solid rgba(0, 204, 255, 0.14);
        background: rgba(7, 15, 18, 0.74);
      }

      .composer input {
        width: 100%;
        border: 1px solid var(--line);
        background: rgba(12, 19, 21, 0.9);
        color: var(--text);
        font: inherit;
        border-radius: 16px;
        padding: 16px 18px;
        outline: none;
      }

      .composer input:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 0 3px rgba(0, 204, 255, 0.12);
      }

      .composer button {
        border: 0;
        border-radius: 16px;
        padding: 0 22px;
        font: inherit;
        font-weight: 700;
        background: linear-gradient(90deg, var(--teal), var(--cyan));
        color: #04131a;
        cursor: pointer;
      }

      .composer button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      @media (max-width: 820px) {
        body {
          padding: 12px;
        }

        .chat-shell {
          min-height: calc(100vh - 24px);
          border-radius: 18px;
        }

        .chat-body {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .message {
          max-width: 88%;
        }
      }

      @media (max-width: 520px) {
        .chat-header {
          flex-wrap: wrap;
          padding: 16px 16px 14px;
        }

        .header-actions {
          width: 100%;
          justify-content: space-between;
        }

        .canvas-header,
        .composer {
          padding-left: 14px;
          padding-right: 14px;
        }

        .messages {
          padding-left: 14px;
          padding-right: 14px;
        }

        .composer {
          grid-template-columns: 1fr;
        }

        .composer button {
          height: 48px;
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-shell">
      <header class="chat-header">
        <div class="brand-wrap">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">LIORA</span>
        </div>

        <div class="header-meta">
          <span class="status-dot" aria-hidden="true"></span>
          <span>AI solar assistant online</span>
        </div>

        <div class="header-actions">
          <a href="/calculator">Calculator</a>
          <a href="/" class="ghost-link">Home</a>
        </div>
      </header>

      <div class="chat-body">
        <aside class="sidebar">
          <div class="sidebar-panel">
            <p class="sidebar-label">Suggested prompts</p>
            <div class="suggestion-list">
              <button class="suggestion-chip" type="button">
                What system size do I need?
              </button>
              <button class="suggestion-chip" type="button">
                How much can I save each month?
              </button>
              <button class="suggestion-chip" type="button">
                Do I need a battery?
              </button>
              <button class="suggestion-chip" type="button">
                How do I reduce my power bill?
              </button>
            </div>
          </div>
        </aside>

        <main class="main-panel">
          <div class="canvas-header">
            <h1>Talk to Liora</h1>
            <span class="model-pill">Liora Solar AI</span>
          </div>

          <div class="messages" id="chatMessages" aria-live="polite">
            <div class="message bot">
              Hi! I'm Liora, your solar planning assistant. Ask me about your
              home, solar sizing, battery needs, or savings.
            </div>
          </div>

          <form class="composer" id="chatForm">
            <input
              id="chatInput"
              type="text"
              placeholder="Ask Liora about your solar plan..."
              autocomplete="off"
            />
            <button id="sendButton" type="submit">Send</button>
          </form>
        </main>
      </div>
    </div>

    <script>
      const form = document.getElementById("chatForm");
      const input = document.getElementById("chatInput");
      const messages = document.getElementById("chatMessages");
      const sendButton = document.getElementById("sendButton");
      const suggestions = document.querySelectorAll(".suggestion-chip");
      const history = [];

      function appendMessage(text, type) {
        const message = document.createElement("div");
        message.className = `message ${type}`;
        message.textContent = text;
        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
        return message;
      }

      suggestions.forEach((button) => {
        button.addEventListener("click", () => {
          input.value = button.textContent;
          form.requestSubmit();
        });
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, "user");
        input.value = "";
        input.disabled = true;
        sendButton.disabled = true;

        const pending = appendMessage("Thinking...", "bot");
        const context = JSON.parse(
          localStorage.getItem("lioraCalculation") || "{}",
        );

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              history,
              context: {
                city: context.city || "",
                daily_kwh: String(context.daily || ""),
                system_kw: String(context.system || ""),
              },
            }),
          });

          const data = await response.json();
          if (!response.ok)
            throw new Error(data.detail || "The assistant is unavailable.");

          pending.textContent = data.answer;
          history.push(
            { role: "user", content: text },
            { role: "assistant", content: data.answer },
          );
          if (history.length > 20) history.splice(0, history.length - 20);
        } catch (error) {
          pending.textContent = error.message;
        } finally {
          input.disabled = false;
          sendButton.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
